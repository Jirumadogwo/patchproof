[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchproof"
version = "0.1.0"
description = "Software-repair evaluation toolkit for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2,<3", "pytest>=8,<9"]

[project.optional-dependencies]
dev = ["build>=1,<2"]

[project.scripts]
patchproof = "patchproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchproof*"]
