name: PatchProof CI & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install ruff bandit safety

      - name: Run Linting (Ruff)
        run: ruff check src/ tests/

      - name: Run Python Security Scan (Bandit)
        run: bandit -r src/ -ll -ii

      - name: Run Dependency Vulnerability Check (Safety)
        run: safety check || true

      - name: Run Pytest Test Suite
        run: pytest --maxfail=1 --disable-warnings -v
